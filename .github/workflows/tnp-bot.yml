name: TnP Telegram bot

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (GitHub may delay runs a few minutes)
  workflow_dispatch:          # lets you press "Run workflow" manually

permissions:
  contents: write             # needed to save seen.json back to the repo

concurrency:
  group: tnp-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check TnP site
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TNP_URL:   https://tp.bitmesra.co.in/index.html,https://tp.bitmesra.co.in/newsevents
          LOGIN_URL: https://tp.bitmesra.co.in/login.html
          TNP_USERNAME:       ${{ secrets.TNP_USERNAME }}
          TNP_PASSWORD:       ${{ secrets.TNP_PASSWORD }}
          USERNAME_FIELD:     ${{ secrets.USERNAME_FIELD }}
          PASSWORD_FIELD:     ${{ secrets.PASSWORD_FIELD }}
          ITEM_SELECTOR:      ${{ secrets.ITEM_SELECTOR }}
          VERIFY_SSL:         ${{ secrets.VERIFY_SSL }}
        run: python tnp_bot.py --once
      - name: Save what has been seen
        if: always()
        run: |
          git config user.name  "tnp-bot"
          git config user.email "tnp-bot@users.noreply.github.com"
          git add seen.json || true
          git diff --cached --quiet || (git commit -m "update seen notices" && git push)
