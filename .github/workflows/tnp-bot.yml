name: TnP Telegram bot

on:
  schedule:
    - cron: "*/5 * * * *"    # GitHub starts a run about hourly; each run stays awake (see below)
  workflow_dispatch:          # lets you press "Run workflow" manually
    inputs:
      hello:
        description: "Only send a hello message to the group (test)"
        type: boolean
        default: false

permissions:
  contents: write             # needed to save seen.json back to the repo

concurrency:
  group: tnp-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check TnP site
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TNP_URL:   https://tp.bitmesra.co.in/index.html,https://tp.bitmesra.co.in/newsevents
          LOGIN_URL: https://tp.bitmesra.co.in/login.html
          TNP_USERNAME:       ${{ secrets.TNP_USERNAME }}
          TNP_PASSWORD:       ${{ secrets.TNP_PASSWORD }}
          USERNAME_FIELD:     ${{ secrets.USERNAME_FIELD }}
          PASSWORD_FIELD:     ${{ secrets.PASSWORD_FIELD }}
          ITEM_SELECTOR:      ${{ secrets.ITEM_SELECTOR }}
          VERIFY_SSL:         ${{ secrets.VERIFY_SSL }}
          CHECK_INTERVAL_SEC: 60     # check the portal every 1 minute
          GIT_COMMIT: 1
          PYTHONUNBUFFERED: 1        # show log lines live
        # always-on: keep checking for ~5h40m; the next queued run takes over after
        run: python tnp_bot.py ${{ inputs.hello && '--hello' || '--loop-minutes 340' }}
      - name: Save what has been seen
        if: always()
        run: |
          git config user.name  "tnp-bot"
          git config user.email "tnp-bot@users.noreply.github.com"
          git add seen.json || true
          git diff --cached --quiet || (git commit -m "update seen notices" && (git push || (git pull --rebase && git push)))
